name: Build Android APK

# Manual trigger only: run it from the Actions tab with "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      # THE signing key. Every APK must be signed with this one file, or Android
      # refuses to install the new build over the old one
      # (INSTALL_FAILED_UPDATE_INCOMPATIBLE) and you have to uninstall first.
      #
      # This step used to generate a fresh keystore and commit it whenever the
      # file was missing, which is exactly what kept breaking in-place updates:
      # dispatching the workflow from a branch that predates the committed key
      # minted a brand-new random one, so that APK installed only after an
      # uninstall and the next build from main -- signed with the original key
      # again -- was rejected. Never generate a key here. Fail loudly instead.
      - name: Require the committed signing key
        run: |
          test -f android-overrides/debug.keystore || {
            echo "::error::android-overrides/debug.keystore is missing on this branch."
            echo "::error::Rebase on main (the key landed in 199c84a) and re-run."
            echo "::error::Do NOT generate a new one -- a new key breaks in-place updates."
            exit 1
          }

      - run: npm install

      - run: npm run build
        env:
          # Relative asset base so the WebView (served from https://localhost/)
          # can load the bundle. Without this the app is a black screen.
          CAP_BUILD: '1'
          # Same variables as the Pages deploy. Without them the app runs in
          # guest-only mode (no "Sign in with Google").
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMOB_ANDROID_BANNER_ID: ${{ vars.VITE_ADMOB_ANDROID_BANNER_ID }}
          VITE_ADS_TESTING: ${{ vars.VITE_ADS_TESTING }}
          # Shown in Account as the version, matching the versionName stamped below.
          VITE_APP_VERSION: 1.0.${{ github.run_number }}

      # android/ is gitignored and generated, so recreate it in the runner.
      - run: npx cap add android
      # Generate launcher icons (adaptive + legacy, all densities) and the
      # native splash drawables into the fresh android/ project from the
      # committed source art in assets/ (produced by `npm run gen:icons`).
      - run: npx capacitor-assets generate --android
      # Sharpen the Android 12+ system splash. `capacitor-assets` only emits the
      # pre-12 full-screen splash.png, so on API 31+ the OS up-scales the
      # low-res (192px at xxxhdpi) adaptive-launcher foreground into its ~288dp
      # icon slot and it looks blurry. Point that slot at a dedicated 1152px
      # mark instead, via a values-v31 launch-theme override.
      - run: |
          mkdir -p android/app/src/main/res/values-v31 android/app/src/main/res/drawable-nodpi
          cp android-overrides/values-v31/styles.xml android/app/src/main/res/values-v31/styles.xml
          cp assets/android12-splash-icon.png android/app/src/main/res/drawable-nodpi/android12_splash_icon.png
      # Sharpen the adaptive launcher icon. `capacitor-assets` 3.0.5, given an
      # explicit assets/icon-foreground.png, resizes it with the legacy icon
      # table (192px at xxxhdpi), so Android upscales that layer onto the 108dp
      # (= 432px) adaptive canvas and the mark looks soft. Point the foreground
      # at a 512px nodpi asset instead, via an override ic_launcher.xml that
      # also drops the generator's doubled inset="16.7%".
      - run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/drawable-nodpi
          cp android-overrides/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android-overrides/mipmap-anydpi-v26/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp assets/ic-adaptive-fg.png android/app/src/main/res/drawable-nodpi/ic_adaptive_fg.png
      # Swap in the immersive full-screen MainActivity (hides both system bars).
      - run: cp android-overrides/MainActivity.java android/app/src/main/java/com/guitarfretpractice/app/MainActivity.java
      # The in-app self-update plugin (registered by that MainActivity).
      - run: cp android-overrides/AppUpdaterPlugin.java android/app/src/main/java/com/guitarfretpractice/app/AppUpdaterPlugin.java
      # ...and the FileProvider path its downloaded APK lives under.
      - run: cp android-overrides/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml
      # Swap in the manifest with the OAuth-callback deep-link intent-filter.
      - run: cp android-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      # Monotonic versionCode + a matching visible versionName, so every new
      # APK is seen as an update of the previous one (installs in place, app
      # data kept) and you can tell from Settings > Apps which build is on the
      # phone. `github.run_number` only ever increases, so a newer APK is never
      # rejected as a version downgrade. Fail the build loudly if the Capacitor
      # template moved and the substitution missed — a silently un-bumped
      # `versionCode 1` would later block installs once a higher-numbered build
      # is already on the device.
      - name: Stamp the build version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle
          grep -q "versionName \"1.0.${{ github.run_number }}\"" android/app/build.gradle
      - run: npx cap sync android

      # Point the debug build type at the committed key explicitly. Relying on
      # Gradle's default -- whatever happens to sit in ~/.android/debug.keystore
      # on the runner -- makes the signature an accident of the environment.
      # Naming the file here makes it a property of the repo instead.
      - name: Sign with the committed key
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../android-overrides/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE

      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android

      # Last line of defence: prove the APK that is about to be published is
      # signed with the committed key. If these two fingerprints ever diverge
      # the build fails here, instead of the mismatch showing up as a failed
      # install on the phone days later.
      - name: Verify the APK signature
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          expected=$(keytool -exportcert -alias androiddebugkey -storepass android             -keystore android-overrides/debug.keystore | sha256sum | cut -d' ' -f1)
          actual=$("$apksigner" verify --print-certs "$apk"             | sed -n 's/.*SHA-256 digest: *//p' | head -1)
          echo "expected $expected"
          echo "actual   $actual"
          [ "$expected" = "$actual" ] || {
            echo "::error::APK is not signed with android-overrides/debug.keystore."
            exit 1
          }
          {
            echo "### APK ${{ github.run_number }}"
            echo ""
            echo "- versionCode \`${{ github.run_number }}\`, versionName \`1.0.${{ github.run_number }}\`"
            echo "- signing key SHA-256 \`$actual\`"
            echo ""
            echo "Installs over any earlier build with the same key -- no uninstall."
          } >> "$GITHUB_STEP_SUMMARY"

      # Publish the APK for the in-app self-update — PRIVATELY. The repo is
      # public, so no GitHub Release: the APK goes to the private Supabase
      # Storage bucket `app-releases` (supabase/migrations/0019_app_updates.sql),
      # which only admins and public.apk_testers can read. latest.json points
      # the app at the newest build; the previous APK is deleted afterwards.
      # Needs the SUPABASE_SERVICE_ROLE_KEY repository SECRET (never a var);
      # without it this step is skipped and the APK is only a run artifact.
      - name: Publish the APK to the private update bucket
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CODE: ${{ github.run_number }}
        run: |
          if [ -z "$SERVICE_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret not set -- the in-app update was not published."
            exit 0
          fi
          api="$SUPABASE_URL/storage/v1/object"
          auth=(-H "Authorization: Bearer $SERVICE_KEY" -H "apikey: $SERVICE_KEY")
          old=$(curl -sf "${auth[@]}" "$api/app-releases/latest.json" | jq -r '.path // empty' || true)
          path="apk/app-$CODE.apk"
          curl -sSf -X POST "${auth[@]}" -H "x-upsert: true" -H "cache-control: max-age=0" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @android/app/build/outputs/apk/debug/app-debug.apk "$api/app-releases/$path"
          printf '{"versionCode":%s,"versionName":"1.0.%s","path":"%s"}' "$CODE" "$CODE" "$path" > latest.json
          curl -sSf -X POST "${auth[@]}" -H "x-upsert: true" -H "cache-control: max-age=0" \
            -H "Content-Type: application/json" --data-binary @latest.json "$api/app-releases/latest.json"
          if [ -n "$old" ] && [ "$old" != "$path" ]; then
            curl -sS -X DELETE "${auth[@]}" "$api/app-releases/$old" || true
          fi
          echo "- published to the private update bucket as \`$path\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
